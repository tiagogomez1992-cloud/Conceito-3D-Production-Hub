services:
  hub:
    build: ./hub
    container_name: conceito3d-production-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HUB_AUTH_USER: ${HUB_AUTH_USER:-}
      HUB_AUTH_PASSWORD: ${HUB_AUTH_PASSWORD:-}
    volumes:
      - hub-data:/app/data

volumes:
  hub-data:
