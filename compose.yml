name: conceito3d-production-hub

services:
  database:
    image: postgres:16-alpine
    container_name: conceito3d-production-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-production_hub}
      POSTGRES_USER: ${POSTGRES_USER:-production_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    volumes:
      - production-hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: conceito3d-production-hub-api
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATA_DIRECTORY: /data
      DATABASE_URL: postgresql://${POSTGRES_USER:-production_hub}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-production_hub}
    volumes:
      - production-hub-data:/data
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: conceito3d-production-hub
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  production-hub-postgres:
  production-hub-data:
